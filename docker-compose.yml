version: "3.9"

services:
  db:
    image: postgres:16
    container_name: blogapi_db
    restart: always
    environment:
      POSTGRES_DB: BlogApi_NewStructure_DB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "aniket123"
    ports:
      - "5432:5432"
    volumes:
      - blogapi_postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: blogapi_app
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8000:8000"

volumes:
  blogapi_postgres_data: